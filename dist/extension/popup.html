<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>License · FB Scraper</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fcfcfd;
            --page: #f4f4f5;
            --raised: #f4f4f5;
            --border: #e4e4e7;
            --text: #18181b;
            --text-2: #52525b;
            --muted: #6b6b74;
            --accent: #047857;
            --accent-hover: #065f46;
            --accent-text: #047857;
            --accent-soft: rgba(4, 120, 87, .1);
            --danger-text: #b91c1c;
            --danger-soft: rgba(185, 28, 28, .07);
            --warn-text: #b45309;
            --warn-soft: rgba(180, 83, 9, .1);
            --on-accent: #fafafa;
            --ring: rgba(4, 120, 87, .35);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1f;
                --page: #141416;
                --raised: #26262a;
                --border: #313136;
                --text: #f4f4f5;
                --text-2: #b4b4bb;
                --muted: #8e8e96;
                --accent-text: #6ee7b7;
                --accent-soft: rgba(52, 211, 153, .14);
                --danger-text: #fca5a5;
                --danger-soft: rgba(248, 113, 113, .12);
                --warn-text: #fcd34d;
                --warn-soft: rgba(252, 211, 77, .12);
                --ring: rgba(52, 211, 153, .45);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-width: 340px;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        /* Opened as a tab from the panel: centre the card on a quieter page. */
        body.in-tab { min-height: 100vh; display: grid; place-items: start center; padding: 10vh 16px 32px; background: var(--page); }
        body.in-tab main { border: 1px solid var(--border); border-radius: 14px; background: var(--bg); box-shadow: 0 16px 40px rgba(24, 24, 27, .1); }
        main { width: 100%; max-width: 380px; padding: 18px; }
        header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex-shrink: 0; }
        .logo svg { width: 17px; height: 17px; }
        h1 { margin: 0; font-size: 15px; font-weight: 650; }
        .subtitle { margin: 0; color: var(--muted); font-size: 12px; }
        .status { padding: 12px 14px; border-radius: 10px; background: var(--raised); margin-bottom: 14px; }
        .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--warn-soft); color: var(--warn-text); }
        .badge.ok { background: var(--accent-soft); color: var(--accent-text); }
        .badge.bad { background: var(--danger-soft); color: var(--danger-text); }
        .status p { margin: 8px 0 0; color: var(--text-2); font-size: 13px; }
        .status dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 13px; }
        .status dt { color: var(--muted); }
        .status dd { margin: 0; font-variant-numeric: tabular-nums; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
        input {
            width: 100%; height: 38px; padding: 0 12px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg); color: var(--text);
            font: 600 14px/1 'Cascadia Mono', Consolas, ui-monospace, monospace; letter-spacing: .03em;
        }
        input::placeholder { color: var(--muted); font-weight: 400; letter-spacing: 0; }
        input:focus-visible, button:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
        button {
            height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid transparent;
            font: inherit; font-weight: 600; cursor: pointer;
        }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .primary { width: 100%; margin-top: 10px; background: var(--accent); color: var(--on-accent); }
        .primary:hover:not(:disabled) { background: var(--accent-hover); }
        .ghost { width: 100%; margin-top: 12px; background: transparent; border-color: var(--border); color: var(--text-2); }
        .ghost:hover:not(:disabled) { color: var(--danger-text); background: var(--danger-soft); }
        .feedback { min-height: 20px; margin: 10px 0 0; font-size: 13px; color: var(--danger-text); }
        .feedback.ok { color: var(--accent-text); }
        .note { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <header>
            <div class="logo" id="logo" aria-hidden="true"></div>
            <div>
                <h1 id="title">FB Scraper</h1>
                <p class="subtitle" id="subtitle"></p>
            </div>
        </header>

        <section class="status" aria-live="polite">
            <span class="badge" id="badge"></span>
            <p id="status-text"></p>
            <dl id="details" hidden>
                <dt id="type-label"></dt><dd id="type-value"></dd>
                <dt id="key-label"></dt><dd id="key-value"></dd>
            </dl>
        </section>

        <form id="activate-form" novalidate>
            <label for="key" id="key-input-label"></label>
            <input id="key" name="key" autocomplete="off" spellcheck="false" placeholder="UADS-XXXX-XXXX-XXXX-XXXX-XXXX">
            <button class="primary" type="submit" id="activate"></button>
        </form>
        <p class="feedback" id="feedback" role="status"></p>

        <button class="ghost" type="button" id="remove" hidden></button>

        <p class="note" id="note"></p>
    </main>
    <script type="module" src="popup.js"></script>
</body>
</html>
